<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#276b35">
  <meta name="description" content="Descubre Minecraft Trial y ve a Google Play para descargar la prueba oficial gratuita.">
  <title>Minecraft Trial | chatNokiAPK</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #193d25;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        linear-gradient(180deg, rgba(14, 40, 20, .22), rgba(11, 34, 18, .92)),
        repeating-linear-gradient(0deg, #337d32 0 42px, #2d722d 42px 84px);
    }
    main {
      width: min(100%, 760px);
      overflow: hidden;
      border: 4px solid #173b20;
      border-radius: 12px;
      background: #1d4727;
      box-shadow: 0 18px 55px #071a0db3;
      text-align: center;
    }
    .top-grass {
      height: 24px;
      background: repeating-linear-gradient(90deg, #63bd3b 0 32px, #54a933 32px 64px);
      border-bottom: 5px solid #794a2e;
    }
    .content { padding: clamp(24px, 6vw, 52px); }
    .brand { margin: 0 0 22px; color: #c8f89f; font-size: .9rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .cover {
      display: block;
      width: min(220px, 55vw);
      aspect-ratio: 1;
      object-fit: cover;
      margin: 0 auto 24px;
      border: 5px solid #c8f89f;
      border-radius: 20px;
      box-shadow: 0 9px 0 #12371d, 0 16px 28px #081c0e80;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; text-shadow: 0 4px #183d20; }
    .subtitle { margin: 12px 0 28px; color: #e0f6d5; font-size: 1.1rem; }
    .download {
      display: inline-block;
      width: min(100%, 520px);
      padding: 20px 24px;
      border: 0;
      border-bottom: 7px solid #23612a;
      border-radius: 8px;
      background: #5ac943;
      color: #102b16;
      font-size: clamp(1.05rem, 4vw, 1.5rem);
      font-weight: 950;
      text-decoration: none;
      text-shadow: 0 1px #b5f59d;
      box-shadow: 0 6px 18px #091c0d80;
      transition: transform .12s ease, background .12s ease;
    }
    .download:hover { background: #73e15b; transform: translateY(-2px); }
    .download:active { transform: translateY(3px); border-bottom-width: 4px; }
    .note { margin: 20px 0 0; color: #c9e6c1; font-size: .9rem; }
    .note a { color: #e6ffd9; }
    .bottom-grass { height: 18px; background: repeating-linear-gradient(90deg, #54a933 0 32px, #63bd3b 32px 64px); border-top: 5px solid #794a2e; }
  </style>
</head>
<body>
  <main>
    <div class="top-grass" aria-hidden="true"></div>
    <section class="content" aria-labelledby="page-title">
      <p class="brand">chatNokiAPK</p>
      <img
        class="cover"
        src="https://play-lh.googleusercontent.com/FO4IOOftZCVp0wrY1-AyoELiXGujlOM837iCAeJxBHMfYHA7miVNJ7FOkDMBTcyeDA=s512-rw"
        alt="Portada de Minecraft Trial"
        width="220"
        height="220"
      >
      <h1 id="page-title">Minecraft Trial</h1>
      <p class="subtitle">Explora, construye y disfruta la prueba gratuita oficial.</p>
      <a
        class="download"
        href="https://play.google.com/store/apps/details?id=com.mojang.minecrafttrialpe"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Descargar Minecraft Trial gratis desde Google Play"
      >DESCARGAR MINECRAFT</a>
      <p class="note">Descarga oficial gratuita desde <a href="https://play.google.com/store/apps/details?id=com.mojang.minecrafttrialpe" target="_blank" rel="noopener noreferrer">Google Play</a>.</p>
    </section>
    <div class="bottom-grass" aria-hidden="true"></div>
  </main>
</body>
</html>
